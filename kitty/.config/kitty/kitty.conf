# ╔════════════════╗
# ║  kitty config  ║
# ╚════════════════╝

# main settings ------------------------------
font_family                JetBrains Mono
font_size                  14.0
window_padding_width       8
shell                      fish     
# bash
confirm_os_window_close    0           
# 0=no 1=yes
copy_on_select             clipboard
mouse_hide_wait            2.0
enable_audio_bell          no          
# no yes
strip_trailing_spaces      smart       
smart always never
url_style                  curly       
# none straight double curly dotted dashed
underline_hyperlinks       always      
# always never

# cursor settings ----------------------------
cursor_shape                   block
# block beam underline
cursor_shape_unfocused         block
# block beam underline hollow
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2

# font zoom ----------------------------------
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# design -------------------------------------
foreground #F1E8B8 
background #0C0F0A
background_opacity 0.95

selection_foreground #ffffff
selection_background #14b8a6
color0 #0b0c15
color1 #d2556c
color2 #7cd47b
color3 #efb184
color4 #6ca1f3
color5 #b78df0
color6 #69bcf4
color7 #c0caf5
color8  #39404a
color9  #f7768e
color10 #85e89d
color11 #f4cf8d
color12 #8fb9ff
color13 #d9a3ff
color14 #8fd3ff
color15 #f0f3f6
